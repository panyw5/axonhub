name: Keep Render Service Alive

on:
  schedule:
    # 每 10 分钟运行一次
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest  # 使用 Linux，1:1 计费
    timeout-minutes: 2      # 设置超时，避免卡住浪费分钟数
    
    steps:
      - name: Ping Render Service
        run: |
          echo "Pinging service at $(date)"
          curl -f --max-time 30 https://axonhub-lz7k.onrender.com/health || \
          curl -f --max-time 30 https://axonhub-lz7k.onrender.com/ || \
          echo "Service might be starting up"
